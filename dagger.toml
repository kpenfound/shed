# Dagger workspace configuration. `dagger check` builds and tests the Go
# module. The Go module is a copy of github.com/dagger/go that installs the
# pinned jj release and sets SHED_REQUIRE_JJ, so jj tests run instead of
# skipping.

[modules.go]
source = ".dagger/modules/shed-go"

[modules.go.settings]
base = "golang:1.26-trixie"
# Keep the module's own helper out of the modules under test, and shed's
# state directory too: its unit workspaces hold whole copies of this module.
test = ["**", "!.dagger", "!.shed/**"]
generate = ["**", "!.dagger", "!.shed/**"]

# The Go patterns mount only Go sources. The repository's own documents are
# checked by a test, so they are mounted too.
includeExtraFiles = [
  "charter.md",
  "horizon.md",
  "spec/**",
  "shed.toml",
]
